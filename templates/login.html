{{define "main"}}
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <div class="auth-logo-icon"><i class="fa-solid fa-mug-hot"></i></div>
                <h2>Sign In to TEACHAR</h2>
                <p>Access your orders, saved favorites, and quick checkout</p>
            </div>

            {{if .Error}}
            <div class="alert alert-danger">
                <i class="fa-solid fa-triangle-exclamation"></i> {{.Error}}
            </div>
            {{end}}

            <form action="/login" method="POST" class="auth-form">
                <input type="hidden" name="redirect" value="{{.Redirect}}">

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" value="{{.Email}}" placeholder="e.g. client@teachar.in" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
                    <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="demo-credentials-card" style="margin-top:1.5rem; padding:1.25rem; border:1px solid var(--border-color, #e5e7eb); border-radius:10px; background:var(--bg-main, #f9fafb);">
                <h4 style="margin-bottom:0.85rem; font-size:0.95rem; font-weight:700; color:var(--text-main);"><i class="fa-solid fa-user-check" style="color:var(--primary);"></i> Sample Customer Account:</h4>
                <div class="demo-account-list" style="display:flex; flex-direction:column; gap:0.6rem;">
                    <!-- Client -->
                    <div class="demo-account-item" onclick="fillDemo('client@teachar.in', 'Client@123')" style="cursor:pointer; padding:0.65rem 0.85rem; border:1px solid #a7f3d0; border-radius:8px; background:#ecfdf5;" title="Click to fill Client credentials">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.25rem;">
                            <span style="color:#059669; font-weight:700; font-size:0.9rem;"><i class="fa-solid fa-user"></i> Registered Customer</span>
                            <span style="font-size:0.75rem; color:#059669; background:#d1fae5; padding:0.15rem 0.5rem; border-radius:4px; font-weight:600;">Auto Fill</span>
                        </div>
                        <div style="font-size:0.85rem; color:#374151; word-break:break-all;">
                            <i class="fa-solid fa-envelope" style="font-size:0.75rem; color:#9ca3af; margin-right:0.25rem;"></i><code>client@teachar.in</code>
                            <span style="margin:0 0.35rem; color:#d1d5db;">•</span>
                            <i class="fa-solid fa-lock" style="font-size:0.75rem; color:#9ca3af; margin-right:0.25rem;"></i><code>Client@123</code>
                        </div>
                    </div>
                </div>
            </div>

            <script>
            function fillDemo(email, password) {
                document.getElementById('email').value = email;
                document.getElementById('password').value = password;
            }
            </script>

            <div class="auth-footer text-center mt-4">
                <p>Don't have an account yet? <a href="/register" class="link-primary">Create an account</a></p>
            </div>
        </div>
    </div>
</section>
{{end}}
