{{define "main"}}
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <div class="auth-logo-icon"><i class="fa-solid fa-mug-hot"></i></div>
                <h2>Sign In to TEACHAR</h2>
                <p>Access your orders, saved favorites, and quick checkout</p>
            </div>

            {{if .Error}}
            <div class="alert alert-danger">
                <i class="fa-solid fa-triangle-exclamation"></i> {{.Error}}
            </div>
            {{end}}

            <form action="/login" method="POST" class="auth-form">
                <input type="hidden" name="redirect" value="{{.Redirect}}">

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" value="{{.Email}}" placeholder="e.g. client@teachar.in" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
                    <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="demo-credentials-card">
                <h4><i class="fa-solid fa-key"></i> Quick Demo Accounts:</h4>
                <div class="demo-account">
                    <strong>Admin:</strong> <code>admin@teachar.in</code> / <code>Admin@123</code>
                </div>
                <div class="demo-account">
                    <strong>Client:</strong> <code>client@teachar.in</code> / <code>Client@123</code>
                </div>
            </div>

            <div class="auth-footer text-center mt-4">
                <p>Don't have an account yet? <a href="/register" class="link-primary">Create an account</a></p>
            </div>
        </div>
    </div>
</section>
{{end}}
